name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  precheck:
    uses: omni-stove/.github/.github/workflows/precheck.yml@main
    permissions:
      pull-requests: read

  checks:
    needs: precheck
    if: needs.precheck.outputs.proceed == 'true'
    uses: omni-stove/.github/.github/workflows/ci.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      run-review: true
      review-provider: "claude"
      review-allowed-bots: "omni-stove-agent"  # 自前の Issue Worker の PR はレビューする。外部 App は "*" にすると起動してしまうので名指しで許可
      # Issue Worker と同じ Unity 固有の規約で見させる。.meta などはレビュー対象から外しているので、それらを書き換えるコードの側で見る
      review-instructions: "Follow AGENTS.md and .agents/refs/scriptability-rules.md. This is a Unity project: flag scripts that regenerate existing .meta files (their GUIDs are what scenes and assets reference), changes that rely on hand-editing .unity / .prefab / .asset files instead of wiring references in code or editor scripts, and Unity dependencies leaking into dotnet/Fps.Core."
      review-exclude-patterns: |
        *.meta
        *.unity
        *.prefab
        *.asset
        *.mat
        *.inputactions
        Packages/packages-lock.json
    secrets: inherit

  lint:
    needs: precheck
    if: needs.precheck.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/**/*.csproj', 'dotnet/Directory.Build.props') }}

      # 抜けた .meta の差分を CI Gate に渡し、PR に [regen] コミットとして積ませる。
      # dotnet を使わないので Restore の失敗に巻き込まれないよう先に走らせる
      - name: Generate .meta
        run: scripts/lint.sh --fix-meta

      - uses: omni-stove/.github/actions/regen-diff@main
        with:
          pathspec: '*.meta'

      - name: Restore
        run: scripts/install.sh

      - name: Lint
        run: scripts/lint.sh

  test:
    needs: precheck
    if: needs.precheck.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/**/*.csproj', 'dotnet/Directory.Build.props') }}

      - name: Restore
        run: scripts/install.sh

      - name: Test
        run: scripts/test.sh

  ci:
    needs: [precheck, checks, lint, test]
    if: always()
    uses: omni-stove/.github/.github/workflows/ci-gate.yml@main
    permissions:
      actions: read  # run-fix が失敗ログを読むため
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      run-fix: true
      fix-provider: "claude"
      # 自動修正のエージェントにも Issue Worker と同じ Unity 固有の規約を守らせる
      fix-instructions: "Follow AGENTS.md and .agents/refs/scriptability-rules.md. This is a Unity project: never edit or regenerate an existing .meta, and wire references in code or editor scripts instead of hand-editing .unity / .prefab / .asset files. Do not write a .meta for a new folder or a new .cs, .asmdef, .asmref, .txt, .json, .xml, .html, .htm, .bytes, .csv, .yaml or .fnt file under Assets yourself; CI generates it."
      run-merge: true  # CI Gate が通り approve した PR を agent App でマージする。止めるなら skip-automerge ラベル
      results: ${{ toJSON(needs) }}
      conflicted: ${{ needs.precheck.outputs.conflicted }}
      review-comments: ${{ needs.checks.outputs.review-comments }}
      review-result: ${{ needs.checks.outputs.review-result }}
    secrets: inherit
