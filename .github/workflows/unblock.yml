name: Unblock

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      parents:
        description: 見る親 Issue の番号 (空白かカンマ区切り)。空なら open な sub-issue を持つすべての親
        type: string
        default: ""

jobs:
  unblock:
    uses: omni-stove/.github/.github/workflows/unblock.yml@main
    permissions:
      issues: read
    secrets: inherit
