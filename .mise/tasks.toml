[install]
description = "Restore the NuGet packages of dotnet/Fps.slnx"
run = "scripts/install.sh"
quiet = true

[setup]
description = "Install dependencies and skill-kit, then sync (run by make setup)"
depends = ["install"]
run = [
  "curl -fsSL https://raw.githubusercontent.com/omni-stove/skill-kit/main/install.sh | sh",
  "skill-kit game sync",
]

[update]
description = "Pull skill-kit and re-sync this repo"
run = "skill-kit game update"

[lint]
description = "Check C# formatting, style and analyzers (Unity-independent code via dotnet/Fps.slnx, all of Assets/game for whitespace) and that every tracked file/folder under Assets has a tracked .meta and vice versa"
run = "scripts/lint.sh"
quiet = true

[format]
description = "Fix what lint reports as fixable (adds missing .meta for .cs files and folders with git add)"
run = "scripts/lint.sh --fix"
quiet = true

[test]
description = "Run the Unity-independent C# unit tests (every test project in dotnet/Fps.slnx) with dotnet test"
run = "scripts/test.sh"
quiet = true

[build]
description = "Build the client (macos by default, or windows) into Builds/client-<platform>/ with the Unity editor in batch mode (close the Editor first). The version is --version <v>, or git describe --tags --always --dirty"
usage = '''
arg "[platform]" help="macos or windows" default="macos"
flag "--version <version>" help="build version such as v0.2.0 (default: git describe --tags --always --dirty)"
'''
run = 'unity -batchmode -quit -projectPath . -executeMethod Fps.Editor.ClientBuilder.Build -clientPlatform "${usage_platform:-macos}" ${usage_version:+-buildVersion "$usage_version"}'

[build-server]
description = "Build the dedicated server (macos by default, or linux) into Builds/server-<platform>/ with the Unity editor in batch mode (close the Editor first). The version is --version <v>, or git describe --tags --always --dirty"
usage = '''
arg "[platform]" help="macos or linux" default="macos"
flag "--version <version>" help="build version such as v0.2.0 (default: git describe --tags --always --dirty)"
'''
run = 'unity -batchmode -quit -projectPath . -executeMethod Fps.Editor.ServerBuilder.Build -serverPlatform "${usage_platform:-macos}" ${usage_version:+-buildVersion "$usage_version"}'

[server-dotnet]
description = "Build the Unity-independent .NET server (dotnet/Fps.Server) and run it with -mode server. The version is git describe --tags --always --dirty"
run = [
  "dotnet build dotnet/Fps.Server/Fps.Server.csproj -c Release -v q --nologo",
  'dotnet run --project dotnet/Fps.Server/Fps.Server.csproj -c Release --no-build -- -mode server -buildVersion "$(git describe --tags --always --dirty)"',
]

[export-server-data]
description = "Write the collision of every map selectable with -map to server-data/maps/<map>.fpsmap with the Unity editor in batch mode via Fps.Editor.MapCollisionExporter.Export, removing .fpsmap files of maps no longer listed (close the Editor first). Commit the result"
run = "unity --non-interactive run . -- -executeMethod Fps.Editor.MapCollisionExporter.Export"

[eos-sdk]
description = "Place the EOS C# SDK in dotnet/ThirdParty/EOSSDK (not committed) from the PlayEveryWare EOS package in Library/PackageCache, or from an Epic Developer Portal SDK zip/folder with --from <path>"
# 実行権限の無いチェックアウトでも動くよう bash で呼ぶ。引数は mise がこの後ろに付ける
run = "bash scripts/eos-sdk.sh"

[server-image]
description = "Build the Linux dedicated server and package it as a Docker image with docker/server/Dockerfile (close the Editor first). Options: --tag <name:tag> (default fps-server:local), --skip-build to reuse Builds/server-linux/"
# 実行権限の無いチェックアウトでも動くよう bash で呼ぶ。引数は mise がこの後ろに付ける
run = "bash scripts/server-image.sh"

[test-unity]
description = "Run the Unity EditMode tests headlessly in batch mode (close the Editor first)"
run = "unity test --mode EditMode"

[smoke]
description = "Run every SmokeRun in one batch-mode editor via Fps.Editor.SmokeSuite.RunAll; exits 1 if any fails (close the Editor first)"
run = "unity -batchmode -projectPath . -executeMethod Fps.Editor.SmokeSuite.RunAll -logFile -"

[perf]
description = "Host a 16-bot TDM on NetArena01 in one batch-mode editor for 120 s via Fps.Editor.PerfSmokeRun.Run, write the server tick average/max/p95 to Logs/perf.json, and exit 1 if over the budget (avg 4 ms, max 12 ms) (close the Editor first)"
run = "unity -batchmode -projectPath . -executeMethod Fps.Editor.PerfSmokeRun.Run -logFile -"

[nightly-local]
description = "Run the nightly workflow's steps locally: EditMode tests, the smoke suite, and on Sundays (JST) the macOS client build (close the Editor first). Options: --client to always build the client, --no-client to never"
# 実行権限の無いチェックアウトでも動くよう bash で呼ぶ。引数は mise がこの後ろに付ける
run = "bash scripts/nightly-local.sh"
